name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24]
        include:
          - os: ubuntu-latest
            node-version: 22
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types, lint, formatting, and tests
        run: bun run check

      - name: Smoke-test the runtime end to end under Node
        run: |
          repo="$(mktemp -d)"
          git -C "$repo" init -q -b main
          printf 'export const value = 1;\n' > "$repo/app.js"
          git -C "$repo" add app.js
          git -C "$repo" -c user.name=CI -c user.email=ci@example.invalid commit -q -m initial
          printf 'export const value = 2;\n' > "$repo/app.js"
          node dist/runtime/scripts/trace-review.mjs quick --repo "$repo" --no-open
          test -s "$repo/.review/review-working-tree-changes.html"
          node dist/runtime/scripts/validate-review-spec.mjs --spec "$repo/.review/spec.json"

      - name: Smoke-test standard skill installation
        run: |
          stage_root="$(mktemp -d)"
          bun run stage:skill -- "$stage_root/skills/trace-review"
          install_dir="$(mktemp -d)"
          gh skill install "$stage_root" trace-review --from-local --dir "$install_dir"
          node "$install_dir/trace-review/scripts/validate-review-spec.mjs" \
            --spec "$install_dir/trace-review/examples/review-spec.json"
